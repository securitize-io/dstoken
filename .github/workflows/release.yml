name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # The default GITHUB_TOKEN cannot push to master (2 required approvals) and
      # events it generates never trigger workflows. The app token bypasses both.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: rm package-lock.json && npm install

      - name: Build
        run: npm run compile

      - name: Version, publish and tag
        id: release
        run: |
          # The install step deletes and regenerates package-lock.json, so the tree
          # is already dirty here. Restore it and scope every git operation below to
          # the paths changesets owns, or the lockfile churn lands on master.
          git checkout -- package-lock.json

          npx changeset version

          if git diff --quiet -- package.json CHANGELOG.md .changeset; then
            echo "No pending changesets — nothing to release."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "securitize-release-bot[bot]"
          git config user.email "314322097+securitize-release-bot[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md .changeset
          git commit -m "chore: version packages [skip ci]"

          npx changeset publish
          git push --follow-tags origin HEAD:master
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Sync master back to dev
        if: steps.release.outputs.published == 'true'
        run: |
          git fetch origin dev
          git checkout dev
          git merge master --no-edit
          git push origin dev
